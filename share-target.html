<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvar em Conteúdos - Hub Brain</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#050508; color:#fff;
            font-family:'Outfit',sans-serif;
            min-height:100vh;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            padding:20px;
        }
        .st-preview {
            width:100%; max-width:340px;
            aspect-ratio:1; border-radius:20px;
            overflow:hidden; background:#16161a;
            border:1px solid rgba(138,43,226,0.3);
            margin-bottom:20px;
            display:flex; align-items:center; justify-content:center;
            flex-direction:column; gap:10px;
        }
        .st-preview img { width:100%; height:100%; object-fit:contain; }
        .st-preview .st-ico { font-size:80px; }
        .st-preview .st-nome {
            font-size:14px; font-weight:800; color:#fff;
            text-align:center; word-break:break-word;
            padding:0 20px; max-width:100%;
        }
        .st-preview .st-ext {
            font-size:11px; font-weight:800; letter-spacing:2px;
            color:#666; text-transform:uppercase;
        }
        .st-titulo { font-size:22px; font-weight:900; margin-bottom:4px; text-align:center; }
        .st-sub { font-size:13px; color:#666; margin-bottom:24px; text-align:center; }
        .st-mats {
            width:100%; max-width:340px;
            display:flex; flex-direction:column; gap:8px;
            margin-bottom:18px;
            max-height:40vh; overflow-y:auto;
        }
        .st-mat {
            padding:16px; border-radius:16px;
            background:#16161a; border:1px solid rgba(138,43,226,0.2);
            color:#fff; font-family:inherit; font-size:15px; font-weight:700;
            cursor:pointer; text-align:left;
            display:flex; align-items:center; gap:12px;
            transition:all 0.15s;
        }
        .st-mat:active { transform:scale(0.98); }
        .st-mat.on { border-color:#8a2be2; background:rgba(138,43,226,0.15); }
        .st-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .st-salvar {
            width:100%; max-width:340px;
            padding:16px; border-radius:16px; border:none;
            background:#8a2be2; color:#fff;
            font-family:inherit; font-size:15px; font-weight:900;
            cursor:pointer; box-shadow:0 6px 20px rgba(138,43,226,0.4);
        }
        .st-salvar:disabled { opacity:0.5; cursor:not-allowed; }
        .st-vazio-msg {
            width:100%; max-width:340px;
            padding:20px; border-radius:16px;
            background:rgba(255,68,68,0.08);
            border:1px solid rgba(255,68,68,0.25);
            color:#ff9a9a; font-size:13px; font-weight:600;
            text-align:center; line-height:1.5;
            margin-bottom:16px;
        }
        .st-log {
            width:100%; max-width:340px;
            margin-top:16px; padding:12px 14px;
            border-radius:12px;
            background:#16161a;
            border:1px solid rgba(138,43,226,0.25);
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            font-size:11px; line-height:1.55;
            color:#c084fc; max-height:180px; overflow-y:auto;
            display:none;
        }
        .st-log.on { display:block; }
        .st-log .ln { padding:2px 0; word-break:break-word; }
        .st-log .ok { color:#00e5a0; }
        .st-log .err { color:#ff6b6b; font-weight:700; }
        .st-log .warn { color:#ffbb33; }
        .st-log .info { color:#888; }
    </style>
</head>
<body>
    <div class="st-preview" id="st-preview"></div>
    <div class="st-titulo">📚 Salvar em Conteúdos</div>
    <div class="st-sub" id="st-sub">Carregando…</div>
    <div class="st-mats" id="st-mats"></div>
    <button class="st-salvar" id="st-salvar" disabled>Salvar</button>
    <div class="st-log" id="st-log"></div>

    <script>
        // Mostra erro na tela se o módulo não carregar
        window.addEventListener('error', function (e) {
            var box = document.getElementById('st-log');
            if (box) {
                box.classList.add('on');
                var ln = document.createElement('div');
                ln.className = 'ln err';
                ln.textContent = '❌ erro global: ' + (e.message || 'desconhecido');
                box.appendChild(ln);
            }
        });
        window.addEventListener('unhandledrejection', function (e) {
            var box = document.getElementById('st-log');
            if (box) {
                box.classList.add('on');
                var ln = document.createElement('div');
                ln.className = 'ln err';
                ln.textContent = '❌ promise rejeitada: ' + ((e.reason && e.reason.message) || e.reason || 'desconhecido');
                box.appendChild(ln);
            }
        });
        // Marca quando o módulo carregar
        setTimeout(function () {
            var box = document.getElementById('st-log');
            if (box && !box.classList.contains('on')) {
                box.classList.add('on');
                var ln = document.createElement('div');
                ln.className = 'ln err';
                ln.textContent = '❌ share-target.js NÃO carregou em 3s. Verifique se o arquivo existe e não tem erro de sintaxe.';
                box.appendChild(ln);
            }
        }, 3000);
    </script>

    <script type="module" src="share-target.js"></script>
</body>
</html>
