<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Conversor Lottie → Roxo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #05050a; color: #fff; font-family: system-ui; padding: 30px; max-width: 700px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.6; }
  .drop { border: 2px dashed rgba(138,43,226,0.5); border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s; }
  .drop:hover { background: rgba(138,43,226,0.1); }
  .drop.on { background: rgba(138,43,226,0.2); border-color: #8a2be2; }
  input[type=file] { display: none; }
  .lista { margin-top: 20px; display: grid; gap: 10px; }
  .item { background: #14141a; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .item b { color: #c084fc; }
  .ok { color: #00e5a0; }
  .btn { margin-top: 20px; padding: 14px 24px; border: none; border-radius: 12px; background: linear-gradient(135deg,#8a2be2,#6a1fc2); color: #fff; font-weight: 900; font-size: 14px; cursor: pointer; width: 100%; display: none; }
</style>
</head>
<body>

<h1>🎨 Conversor Lottie → Roxo</h1>
<p>Arrasta os 3 JSONs aqui (ou clica pra escolher os 3 de uma vez). O conversor troca todas as cores bege/marrom pelo roxo do Hub Brain e baixa tudo automaticamente.</p>

<label class="drop" id="drop">
  <input type="file" id="file" accept=".json" multiple>
  <div>📁 Solta os 3 arquivos aqui</div>
</label>

<div class="lista" id="lista"></div>
<button class="btn" id="btn">⬇ Baixar todos convertidos</button>

<script>
const MAPA = {
  '0.937254965305,0.796078503132,0.647058844566': '0.753,0.518,0.988',
  '0.835370719433,0.707643389702,0.57282012701':  '0.541,0.169,0.886',
  '0.835294127464,0.705882370472,0.572549045086': '0.541,0.169,0.886',
  '0.510000011968,0.294000004787,0.081999999402': '0.353,0.063,0.753',
  '0.57599995931,0.344999994016,0.13300000359':   '0.416,0.122,0.761',
  '0.20800000359,0.20800000359,0.20800000359':    '0.102,0.039,0.180',
  '0.929000016755,0.929000016755,0.929000016755': '0.051,0.051,0.078',
  '"sc":"#ffffff"': '"sc":"#0d0d12"'
};

const drop = document.getElementById('drop');
const file = document.getElementById('file');
const lista = document.getElementById('lista');
const btn = document.getElementById('btn');
let convertidos = [];

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('on'); });
drop.addEventListener('dragleave', () => drop.classList.remove('on'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('on');
  processar([...e.dataTransfer.files]);
});
file.addEventListener('change', () => processar([...file.files]));

async function processar(arquivos) {
  convertidos = [];
  lista.innerHTML = '';
  for (const arq of arquivos) {
    if (!arq.name.endsWith('.json')) continue;
    let txt = await arq.text();
    const antes = txt.length;
    for (const [velho, novo] of Object.entries(MAPA)) {
      txt = txt.split(velho).join(novo);
    }
    const nome = arq.name.replace('.json', '-roxo.json');
    convertidos.push({ nome, conteudo: txt });
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<span>✅ <b>${arq.name}</b></span><span class="ok">${antes} → ${txt.length} chars</span>`;
    lista.appendChild(item);
  }
  if (convertidos.length) btn.style.display = 'block';
}

btn.addEventListener('click', () => {
  convertidos.forEach((c, i) => {
    setTimeout(() => {
      const blob = new Blob([c.conteudo], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = c.nome;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, i * 300);
  });
});
</script>
</body>
</html>
