<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script>if (!localStorage.getItem('dt_user_name')) { window.location.href = 'login.html'; }</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conteúdos - Hub Brain</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="conteudos.css">
    <link rel="stylesheet" href="hb-rapido.css">
    <link rel="stylesheet" href="theme-toggle.css">

    <style>
        .header-logo-animated {
            position: absolute; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 0; cursor: pointer;
            animation: logoEntrance 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes logoEntrance {
            0% { transform: translateX(-50%) scale(3) rotate(360deg); opacity: 0; }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
        }
        .logo-hub {
            font-size: 20px; font-weight: 900; letter-spacing: 1px; color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: textSlideIn 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s backwards;
        }
        .logo-brain-icon {
            width: 42px; height: 42px; margin: 0 8px; position: relative;
            filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.8));
            animation: brainFloat 3s ease-in-out 2s infinite;
        }
        .logo-brain-icon img {
            width: 100%; height: 100%; object-fit: contain;
            animation: brainPulse 2s ease-in-out 2s infinite;
        }
        .logo-brain {
            font-size: 20px; font-weight: 900; letter-spacing: 1px;
            background: linear-gradient(135deg, #8a2be2 0%, #c084fc 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textSlideIn 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1s backwards;
        }
        @keyframes textSlideIn {
            0% { opacity: 0; transform: scale(0) translateX(0); filter: blur(20px); }
            100% { opacity: 1; transform: scale(1) translateX(0); filter: blur(0); }
        }
        @keyframes brainFloat {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }
        @keyframes brainPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.8)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(138, 43, 226, 1)); }
        }
        .header-logo-animated.spinning .logo-brain-icon img { animation: brainSpinOnce 0.8s ease-in-out; }
        @keyframes brainSpinOnce {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        @media (max-width: 768px) {
            .logo-hub, .logo-brain { font-size: 18px; }
            .logo-brain-icon { width: 36px; height: 36px; }
        }

        .glass-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; height: 70px;
            background: rgba(5,5,8,0.95) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(138,43,226,0.2);
            position: sticky; top: 0; z-index: 1000;
        }
        .btn-menu {
            background: none; border: none; color: white; cursor: pointer;
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-menu i { width: 22px; height: 22px; }
        .ct-header-add {
            width: 42px; height: 42px; border-radius: 12px;
            background: rgba(138,43,226,0.15);
            border: 1px solid rgba(138,43,226,0.3);
            color: #c084fc;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.12s;
        }
        .ct-header-add:active { transform: scale(0.9); }
        .ct-header-add i { width: 20px; height: 20px; }
    </style>
</head>
<body>

<header class="glass-header">
    <button id="open-menu" class="btn-menu" aria-label="Menu">
        <i data-lucide="menu"></i>
    </button>
    <div class="header-logo-animated">
        <span class="logo-hub">HUB</span>
        <div class="logo-brain-icon">
            <img src="icon-514_20260512_161420_0000.png" alt="Brain">
        </div>
        <span class="logo-brain">BRAIN</span>
    </div>
    <button id="ct-add" class="ct-header-add" aria-label="Adicionar">
        <i data-lucide="plus"></i>
    </button>
</header>

<main class="ct-wrap">
    <div id="ct-loading" class="ct-loading"><span class="ct-spin"></span> Carregando…</div>
    <div id="ct-vazio" class="ct-vazio" style="display:none;">
        <div style="font-size:56px;margin-bottom:12px;">📭</div>
        <b>Nenhum conteúdo ainda</b>
        <span>Toque no <b>+</b> para tirar uma foto, escolher da galeria ou enviar um PDF — ou mande pelo WhatsApp</span>
    </div>
    <div id="ct-lista"></div>
</main>

<div id="ct-viewer" class="ct-viewer">
    <div class="ct-viewer-top">
        <div class="ct-viewer-info" id="ct-viewer-info"></div>
        <button class="ct-viewer-btn" id="ct-viewer-share" title="Compartilhar">
            <i data-lucide="share-2" style="width:18px;height:18px;"></i>
        </button>
        <button class="ct-viewer-btn" id="ct-viewer-del" title="Excluir">
            <i data-lucide="trash-2" style="width:18px;height:18px;"></i>
        </button>
        <button class="ct-viewer-btn" id="ct-viewer-x" title="Fechar">✕</button>
    </div>
    <button class="ct-viewer-nav ct-viewer-ant" id="ct-viewer-ant">‹</button>
    <button class="ct-viewer-nav ct-viewer-prox" id="ct-viewer-prox">›</button>
    <img id="ct-viewer-img" alt="">
</div>

<script src="menu.js"></script>
<script type="module" src="conteudos.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
const logo = document.querySelector('.header-logo-animated');
if (logo) {
    logo.addEventListener('mouseenter', function() {
        this.classList.add('spinning');
        setTimeout(() => { this.classList.remove('spinning'); }, 800);
    });
    logo.addEventListener('touchstart', function() {
        this.classList.add('spinning');
        setTimeout(() => { this.classList.remove('spinning'); }, 800);
    });
}
</script>
</body>
</html>
