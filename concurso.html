<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Concursos - Hub Brain</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="theme-toggle.css">
    <link rel="stylesheet" href="concurso.css">
    
    <script src="theme-manager.js"></script>
</head>
<body>

    <!-- HEADER -->
    <header class="glass-header">
        <button id="open-menu" class="btn-menu">
            <i data-lucide="menu"></i>
        </button>
        
        <div class="header-logo" onclick="window.location.href='index.html'">
            <span class="logo-hub">HUB</span>
            <div class="logo-brain-icon">
                <img src="icon-514_20260512_161420_0000.png" alt="Brain">
            </div>
            <span class="logo-brain">BRAIN</span>
        </div>

        <div style="width:44px;"></div>
    </header>

    <!-- CONTAINER -->
    <div class="container">

        <!-- HERO -->
        <div class="concurso-hero">
            <h1 class="concurso-title">📚 Biblioteca de Concursos</h1>
            <p class="concurso-subtitle">Provas, simulados e gabaritos de ENEM, IF, concursos e muito mais</p>
        </div>

        <!-- BARRA DE PESQUISA -->
        <div class="search-bar">
            <div class="search-input-wrapper">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="input-busca" placeholder="Buscar por instituição, ano, disciplina...">
            </div>
            <button class="btn-search" onclick="buscarProvas()">
                <i data-lucide="search"></i>
                Buscar
            </button>
        </div>

        <!-- FILTROS -->
        <div class="filtros-container">
            <div class="filtros-title">Filtros</div>
            <div class="filtros-grid">
                <div>
                    <label class="filtro-label">Instituição</label>
                    <select class="filtro-select" id="filtro-inst" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                        <option value="ENEM">ENEM</option>
                        <option value="IFCE">IFCE</option>
                        <option value="UECE">UECE</option>
                        <option value="UFC">UFC</option>
                        <option value="UERJ">UERJ</option>
                        <option value="Concurso">Concursos Públicos</option>
                        <option value="PUC">PUC</option>
                    </select>
                </div>
                <div>
                    <label class="filtro-label">Disciplina</label>
                    <select class="filtro-select" id="filtro-disc" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                        <option value="Matemática">Matemática</option>
                        <option value="Física">Física</option>
                        <option value="Química">Química</option>
                        <option value="Biologia">Biologia</option>
                        <option value="Português">Português</option>
                        <option value="História">História</option>
                        <option value="Geografia">Geografia</option>
                    </select>
                </div>
                <div>
                    <label class="filtro-label">Tipo</label>
                    <select class="filtro-select" id="filtro-tipo" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                        <option value="prova">Prova</option>
                        <option value="simulado">Simulado</option>
                        <option value="gabarito">Gabarito</option>
                    </select>
                </div>
                <div>
                    <label class="filtro-label">Ano</label>
                    <select class="filtro-select" id="filtro-ano" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- CHIPS ATIVOS -->
        <div class="chips-ativos" id="chips-container" style="display:none;"></div>

        <!-- RESULTADOS -->
        <div class="resultados-header">
            <div class="resultados-count">
                <span id="total-provas">0</span> resultados
            </div>
            <select class="sort-select" id="sort-select" onchange="ordenarProvas()">
                <option value="recente">Mais Recente</option>
                <option value="antigo">Mais Antigo</option>
                <option value="nome">Por Nome (A-Z)</option>
            </select>
        </div>

        <!-- GRID DE PROVAS -->
        <div class="provas-grid" id="provas-grid">
            <!-- Preenchido por JavaScript -->
        </div>

        <!-- EMPTY STATE -->
        <div class="empty-state" id="empty-state" style="display:none;">
            <div class="empty-state-icon">📭</div>
            <h2 class="empty-state-title">Nenhuma prova encontrada</h2>
            <p class="empty-state-text">Tente ajustar seus filtros ou a busca</p>
        </div>

    </div>

    <!-- MODAL PDF -->
    <div class="modal-overlay" id="modal-pdf">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-titulo">--</div>
                <button class="modal-close" onclick="fecharModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="pdf-placeholder">
                    <div class="pdf-placeholder-icon">📄</div>
                    <div class="pdf-placeholder-text" id="modal-texto">PDF será visualizado aqui</div>
                    <p style="color: #555; font-size: 12px;">Use o botão "Download" abaixo para salvar o arquivo</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-download" onclick="downloadPDF()">
                    <i data-lucide="download"></i>
                    Download
                </button>
                <button class="btn-modal btn-fechar" onclick="fecharModal()">
                    <i data-lucide="x"></i>
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="menu.js"></script>
    <script src="concurso.js"></script>
    
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
