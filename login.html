<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub Brain - Login</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div id="hb-loading">
        <img src="https://media.tenor.com/GQAsycjoZG8AAAAi/scuba-scuba-cat.gif" alt="">
        <p>Preparando seu acesso...</p>
    </div>

    <a href="welcome.html" class="voltar">
        <i data-lucide="arrow-left"></i>
    </a>

    <main class="container">

        <div class="topo">
            <img src="icon-514_20260512_161420_0000.png" alt="Hub Brain">
        </div>

        <div class="header-txt">
            <span class="kicker">BEM-VINDO DE VOLTA</span>
            <h1>Entrar no <em>Hub Brain</em></h1>
        </div>

        <form class="form" onsubmit="tentarLogar(event)">
            <div class="campo">
                <label>E-MAIL</label>
                <div class="input-wrap">
                    <i data-lucide="mail"></i>
                    <input type="email" id="user-email" placeholder="seu@email.com" autocomplete="email" spellcheck="false">
                </div>
            </div>

            <div class="campo">
                <label>SENHA</label>
                <div class="input-wrap">
                    <i data-lucide="lock"></i>
                    <input type="password" id="user-pass" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="ver-senha" onclick="toggleSenha()">
                        <i data-lucide="eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <div class="linha-extra">
                <label class="check">
                    <input type="checkbox" id="manter-conectado" checked>
                    <span></span>
                    <small>Manter conectado</small>
                </label>
                <a href="#" onclick="window.recuperarSenha(event)">Esqueci a senha</a>
            </div>

            <div id="login-status" class="status"></div>

            <button type="submit" class="btn-roxo">
                <span>Entrar</span>
                <i data-lucide="arrow-right"></i>
            </button>
        </form>

        <div class="rodape-form">
            <span>Não tem conta?</span>
            <a href="cadastro.html">Criar agora</a>
        </div>

        <button class="btn-visitante" onclick="entrarComoVisitante()">
            <i data-lucide="eye"></i>
            <span>Continuar como visitante</span>
        </button>

        <div class="policy">
            <a href="privacidade.html">Privacidade</a>
            <span>·</span>
            <a href="termos.html">Termos</a>
            <span>·</span>
            <a href="https://instagram.com/hubbrain.app" target="_blank" rel="noopener">
                <i data-lucide="instagram" style="width:12px;height:12px;vertical-align:middle"></i>
                @hubbrain.app
            </a>
        </div>

    </main>

    <script type="module" src="login-logica.js"></script>
    <script src="auth-loader.js"></script>
    <script>
        lucide.createIcons();
        const inputPass = document.getElementById('user-pass');
        window.toggleSenha = function () {
            const t = inputPass.type === 'password' ? 'text' : 'password';
            inputPass.type = t;
            document.getElementById('eye-icon').setAttribute('data-lucide', t === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        };
        window.recuperarSenha = function (e) {
            if (e) e.preventDefault();
            if (typeof window.executarRecuperacao === 'function') window.executarRecuperacao();
        };
    </script>
</body>
</html>
