<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub Brain | Química</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="quimica.css">

     <style>
        /* ═══════════════════════════════════════════════════════════
           HEADER LOGO ANIMADO CENTRALIZADO
           ═══════════════════════════════════════════════════════════ */
        
        .header-logo-animated {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0;
            cursor: pointer;
            animation: logoEntrance 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
 
        /* ANIMAÇÃO DE ENTRADA PRINCIPAL */
        @keyframes logoEntrance {
            0% {
                transform: translateX(-50%) scale(3) rotate(360deg);
                opacity: 0;
            }
            100% {
                transform: translateX(-50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }
 
        /* HUB */
        .logo-hub {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: textSlideIn 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s backwards;
        }
 
        /* CÉREBRO (centro) */
        .logo-brain-icon {
            width: 42px;
            height: 42px;
            margin: 0 8px;
            position: relative;
            filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.8));
            animation: brainFloat 3s ease-in-out 2s infinite;
        }
 
        .logo-brain-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: brainPulse 2s ease-in-out 2s infinite;
        }
 
        /* BRAIN */
        .logo-brain {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #8a2be2 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textSlideIn 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1s backwards;
        }
 
        /* Textos aparecem de dentro */
        @keyframes textSlideIn {
            0% {
                opacity: 0;
                transform: scale(0) translateX(0);
                filter: blur(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateX(0);
                filter: blur(0);
            }
        }
 
        /* Float suave do cérebro */
        @keyframes brainFloat {
            0%, 100% { 
                transform: translateY(0px) rotate(-2deg);
            }
            50% { 
                transform: translateY(-6px) rotate(2deg);
            }
        }
 
        /* Pulso do cérebro */
        @keyframes brainPulse {
            0%, 100% { 
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.8));
            }
            50% { 
                transform: scale(1.1);
                filter: drop-shadow(0 0 25px rgba(138, 43, 226, 1));
            }
        }
 
/* Giro ativado por classe JS */
.header-logo-animated.spinning .logo-brain-icon img {
    animation: brainSpinOnce 0.8s ease-in-out;
}

@keyframes brainSpinOnce {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
}
 
        /* Responsivo */
        @media (max-width: 768px) {
            .logo-hub,
            .logo-brain { 
                font-size: 18px;
            }
            .logo-brain-icon { 
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>

<header class="glass-header">
    <button id="open-menu" class="btn-menu"><i data-lucide="menu"></i></button>
   <div class="header-logo-animated" onclick="abrirSobreDono()">
    <span class="logo-hub">HUB</span>
    <div class="logo-brain-icon">
        <img src="icon-514_20260512_161420_0000.png" alt="Brain">
    </div>
    <span class="logo-brain">BRAIN</span>
</div>
    <div style="width:42px;"></div>
</header>

<div class="container">

    <!-- BUSCA -->
    <div class="search-wrap">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="busca-calc" class="search-input" placeholder="Buscar cálculo..." oninput="filtrarCalculos()">
    </div>

    <!-- CATEGORIAS -->
    <div class="cats-scroll" id="cats-scroll">
        <button class="cat-pill active" onclick="filtrarCategoria(this,'todas')">Todos</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'solucao')">Soluções</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'mol')">Mol & Massa</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'gas')">Gases</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'termoquimica')">Termoquímica</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'cinetica')">Cinética</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'eletro')">Eletroquímica</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'acido')">Ácido/Base</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'mistura')">Misturas</button>
    </div>

    <!-- LISTA DE CALCULADORAS -->
    <div id="lista-calculadoras"></div>

</div>

<!-- MODAL CALCULADORA -->
<div class="modal-overlay" id="modal-calc">
    <div class="modal-sheet" id="modal-content">
        <!-- preenchido via JS -->
    </div>
</div>

<script src="menu.js"></script>
<script src="quimica-logica.js"></script>

    <script>
    // Gira ao passar o mouse OU tocar (mobile)
    const logo = document.querySelector('.header-logo-animated');
    if (logo) {
        // DESKTOP - mouseenter
        logo.addEventListener('mouseenter', function() {
            this.classList.add('spinning');
            setTimeout(() => {
                this.classList.remove('spinning');
            }, 800);
        });
        
        // MOBILE - touch
        logo.addEventListener('touchstart', function() {
            this.classList.add('spinning');
            setTimeout(() => {
                this.classList.remove('spinning');
            }, 800);
        });
    }
</script>
</body>
</html>
