<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub Brain | Química</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="quimica.css">
</head>
<body>

<header class="glass-header">
    <button id="open-menu" class="btn-menu"><i data-lucide="menu"></i></button>
    <div class="header-center">
        <div class="header-icon"><i data-lucide="flask-conical"></i></div>
        <span class="header-title">QUÍMICA</span>
    </div>
    <div style="width:42px;"></div>
</header>

<div class="container">

    <!-- BUSCA -->
    <div class="search-wrap">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="busca-calc" class="search-input" placeholder="Buscar cálculo..." oninput="filtrarCalculos()">
    </div>

    <!-- CATEGORIAS -->
    <div class="cats-scroll" id="cats-scroll">
        <button class="cat-pill active" onclick="filtrarCategoria(this,'todas')">Todos</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'solucao')">Soluções</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'mol')">Mol & Massa</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'gas')">Gases</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'termoquimica')">Termoquímica</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'cinetica')">Cinética</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'eletro')">Eletroquímica</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'acido')">Ácido/Base</button>
        <button class="cat-pill" onclick="filtrarCategoria(this,'mistura')">Misturas</button>
    </div>

    <!-- LISTA DE CALCULADORAS -->
    <div id="lista-calculadoras"></div>

</div>

<!-- MODAL CALCULADORA -->
<div class="modal-overlay" id="modal-calc">
    <div class="modal-sheet" id="modal-content">
        <!-- preenchido via JS -->
    </div>
</div>

<script src="menu.js"></script>
<script src="quimica-logica.js"></script>
</body>
</html>
