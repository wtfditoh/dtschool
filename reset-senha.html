<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="hb-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nova Senha - Hub Brain</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- FUNDO ANIMADO -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <img class="bg-tv-logo" src="icon-514_20260512_161420_0000.png" alt="">

    <main class="login-wrapper">
        <div class="topo">
            <img src="icon-514_20260512_161420_0000.png" alt="Hub Brain">
        </div>

        <div class="header-txt">
            <span class="kicker">RECUPERAÇÃO</span>
            <h1>Criar <em>nova senha</em></h1>
        </div>

        <div class="glass-card">
            <form class="form" onsubmit="salvarNovaSenha(event)">
                <div class="campo">
                    <label>NOVA SENHA</label>
                    <div class="input-wrap">
                        <i data-lucide="lock"></i>
                        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                        <button type="button" class="ver-senha" onclick="toggleSenha()">
                            <i data-lucide="eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label>CONFIRMAR SENHA</label>
                    <div class="input-wrap">
                        <i data-lucide="lock"></i>
                        <input type="password" id="nova-senha-2" placeholder="Repete a senha" autocomplete="new-password">
                    </div>
                </div>

                <div id="login-status" class="status"></div>

                <button type="submit" class="btn-roxo">
                    <span>Atualizar senha</span>
                    <i data-lucide="save"></i>
                </button>
            </form>
        </div>

        <div class="rodape-form">
            <span>Lembrou a senha?</span>
            <a href="login.html">Entrar agora</a>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBh3wsAGXY-03HtT47TFlAZGWrusNtjTrc",
            authDomain: "dt-scho0l.firebaseapp.com",
            projectId: "dt-scho0l"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const inputSenha = document.getElementById('nova-senha');
        const inputSenha2 = document.getElementById('nova-senha-2');
        const status = document.getElementById('login-status');
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        window.toggleSenha = function () {
            const t = inputSenha.type === 'password' ? 'text' : 'password';
            inputSenha.type = t;
            document.getElementById('eye-icon').setAttribute('data-lucide', t === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        };

        window.salvarNovaSenha = async (e) => {
            if (e) e.preventDefault();
            status.classList.remove('show', 'success');
            const novaSenha = inputSenha.value;
            const confirma = inputSenha2.value;

            if (novaSenha.length < 6) {
                status.textContent = '⚠ Mínimo 6 caracteres';
                status.classList.add('show');
                return;
            }
            if (novaSenha !== confirma) {
                status.textContent = '⚠ As senhas não batem';
                status.classList.add('show');
                return;
            }

            try {
                await confirmPasswordReset(auth, oobCode, novaSenha);
                status.textContent = '✓ Senha atualizada! Redirecionando...';
                status.classList.add('show', 'success');
                setTimeout(() => window.location.replace('login.html'), 2500);
            } catch (err) {
                console.error(err);
                status.textContent = '⚠ Link expirou ou é inválido';
                status.classList.add('show');
            }
        };

        lucide.createIcons();
    </script>
</body>
</html>
