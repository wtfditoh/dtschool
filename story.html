<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Stories - Hub Brain</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --roxo: #9333ea;
            --roxo-claro: #c084fc;
            --bg: #0a0a0e;
            --borda: rgba(255,255,255,0.08);
            --txt: #fff;
            --txt-dim: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: #05050a;
            color: var(--txt);
            font-family: 'Outfit', -apple-system, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        header h1 span { color: var(--roxo-claro); }

        header p {
            font-size: 12px;
            color: var(--txt-dim);
            font-weight: 500;
        }

        /* Navegação */
        .nav {
            display: flex;
            gap: 4px;
            background: rgba(20, 20, 26, 0.85);
            border: 1px solid var(--borda);
            border-radius: 999px;
            padding: 5px;
        }

        .nav-btn {
            padding: 10px 22px;
            border: none;
            background: transparent;
            color: var(--txt-dim);
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.on {
            background: var(--roxo);
            color: #fff;
            box-shadow: 0 6px 18px rgba(147,51,234,0.4);
        }

        /* Preview */
        .preview-wrap {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 9 / 16;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }

        .preview-scaler {
            width: 1080px;
            height: 1920px;
            transform-origin: top left;
            transform: scale(0.35185);
        }

        /* Área de render */
        .render-area {
            position: fixed;
            left: -99999px;
            top: 0;
            width: 1080px;
            height: 1920px;
            pointer-events: none;
        }

        /* ═══════════ ESTILO DOS STORIES ═══════════ */
        .story {
            width: 1080px;
            height: 1920px;
            background: radial-gradient(circle at 50% 15%, #1a0b2e 0%, #050508 60%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 90px 70px 70px;
            font-family: 'Outfit', sans-serif;
            color: #fff;
        }

        .story::before {
            content: '';
            position: absolute;
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(147,51,234,0.35), transparent 70%);
            pointer-events: none;
        }

        .story::after {
            content: '';
            position: absolute;
            bottom: -200px;
            right: -200px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(147,51,234,0.15), transparent 70%);
            pointer-events: none;
        }

        .story > * { position: relative; z-index: 1; }

        /* Badge */
        .badge {
            align-self: center;
            display: inline-block;
            background: rgba(147,51,234,0.2);
            border: 1px solid rgba(147,51,234,0.5);
            color: #c084fc;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 5px;
            padding: 14px 30px;
            border-radius: 999px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Título */
        .story-title {
            font-size: 68px;
            font-weight: 900;
            color: #fff;
            line-height: 1.05;
            letter-spacing: -2.5px;
            text-align: center;
            margin-bottom: 18px;
        }

        .story-title em {
            font-style: normal;
            color: var(--roxo-claro);
        }

        .story-sub {
            font-size: 28px;
            color: #888;
            text-align: center;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 46px;
            max-width: 800px;
            align-self: center;
        }

        /* ═══════════ MOCKUP DO CELULAR ═══════════ */
        .phone {
            align-self: center;
            width: 640px;
            height: 720px;
            border-radius: 56px;
            padding: 14px;
            background: linear-gradient(160deg, rgba(147,51,234,0.3), rgba(147,51,234,0.05));
            box-shadow:
                0 40px 90px rgba(0,0,0,0.7),
                0 0 80px rgba(147,51,234,0.3),
                inset 0 0 0 1px rgba(255,255,255,0.05);
            margin-bottom: 50px;
            position: relative;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.6);
            z-index: 5;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 44px;
            overflow: hidden;
            background: #050508;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ═══════════ TELA WELCOME (mockup) ═══════════ */
        .mock-welcome {
            width: 100%;
            height: 100%;
            padding: 50px 32px 30px;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 0%, rgba(147,51,234,0.18), transparent 60%), #050508;
        }

        .mock-w-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(20, 20, 26, 0.9);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            margin-bottom: 44px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .mock-w-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #9333ea;
            box-shadow: 0 0 8px #9333ea;
        }

        .mock-w-hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .mock-w-kicker {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: #c084fc;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .mock-w-title {
            font-size: 34px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1.2px;
            margin-bottom: 14px;
        }

        .mock-w-title em {
            font-style: normal;
            color: #9333ea;
        }

        .mock-w-desc {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.5;
            font-weight: 500;
        }

        .mock-w-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px 20px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
        }

        .mock-w-btn-primario {
            background: linear-gradient(135deg, #9333ea, #6a1fc2);
            color: #fff;
            box-shadow: 0 8px 24px rgba(147,51,234,0.4);
        }

        .mock-w-btn-secundario {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: #9ca3af;
        }

        .mock-w-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 24px;
        }

        .mock-w-stat {
            text-align: center;
        }

        .mock-w-stat b {
            display: block;
            font-size: 16px;
            font-weight: 900;
            color: #c084fc;
            letter-spacing: -0.5px;
        }

        .mock-w-stat span {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #6b7280;
            text-transform: uppercase;
        }

        /* ═══════════ TELA LOGIN (mockup) ═══════════ */
        .mock-login {
            width: 100%;
            height: 100%;
            padding: 50px 32px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at 50% 0%, rgba(147,51,234,0.18), transparent 60%), #050508;
        }

        .mock-l-logo {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: rgba(147,51,234,0.15);
            border: 1px solid rgba(147,51,234,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 26px;
            box-shadow: 0 0 30px rgba(147,51,234,0.4);
        }

        .mock-l-logo svg {
            width: 36px;
            height: 36px;
            color: #c084fc;
            filter: drop-shadow(0 0 8px rgba(147,51,234,0.6));
        }

        .mock-l-header {
            text-align: center;
            margin-bottom: 34px;
            width: 100%;
        }

        .mock-l-kicker {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: #c084fc;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .mock-l-title {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.8px;
        }

        .mock-l-title em {
            font-style: normal;
            color: #9333ea;
        }

        .mock-l-form {
            width: 100%;
        }

        .mock-l-campo {
            margin-bottom: 14px;
        }

        .mock-l-label {
            display: block;
            font-size: 8.5px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #4a4a55;
            text-transform: uppercase;
            margin-bottom: 6px;
            padding-left: 2px;
        }

        .mock-l-input {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: #131319;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            font-size: 13px;
            color: #4a4a55;
            font-weight: 500;
        }

        .mock-l-input.focus {
            border-color: #9333ea;
            background: rgba(147,51,234,0.06);
            box-shadow: 0 0 0 3px rgba(147,51,234,0.15);
        }

        .mock-l-input svg {
            width: 15px;
            height: 15px;
            color: #6b7280;
        }

        .mock-l-input.focus svg { color: #c084fc; }

        .mock-l-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            border-radius: 12px;
            background: linear-gradient(135deg, #9333ea, #6a1fc2);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-top: 8px;
            box-shadow: 0 10px 24px rgba(147,51,234,0.4);
        }

        .mock-l-footer {
            margin-top: 22px;
            font-size: 11px;
            color: #6b7280;
            font-weight: 500;
        }

        .mock-l-footer b {
            color: #c084fc;
            font-weight: 800;
        }

        /* ═══════════ FEATURES EM LINHA ═══════════ */
        .features-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
            max-width: 900px;
            align-self: center;
            margin-bottom: 40px;
        }

        .feat-mini {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(147,51,234,0.2);
            border-radius: 26px;
            padding: 26px 18px;
            text-align: center;
        }

        .feat-mini-icon {
            font-size: 42px;
            line-height: 1;
            margin-bottom: 14px;
        }

        .feat-mini-titulo {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .feat-mini-desc {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
            line-height: 1.35;
        }

        /* Rodapé */
        .story-footer {
            margin-top: auto;
            text-align: center;
        }

        .story-logo {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 9px;
            color: #9333ea;
            text-shadow: 0 0 32px rgba(147,51,234,0.5);
            margin-bottom: 10px;
        }

        .story-url {
            font-size: 22px;
            color: #555;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Botões da ferramenta */
        .botoes {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 380px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px 20px;
            border-radius: 14px;
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primario {
            flex: 1;
            background: linear-gradient(135deg, #9333ea, #6a1fc2);
            color: #fff;
            box-shadow: 0 10px 26px rgba(147,51,234,0.35);
        }

        .btn-primario:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(147,51,234,0.5);
        }

        .btn-primario:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        .btn-secundario {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--borda);
            color: var(--txt-dim);
            padding: 15px 18px;
        }

        .btn-secundario:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }

        .btn svg { width: 16px; height: 16px; }

        .status-msg {
            font-size: 12px;
            color: #00e5a0;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: center;
            height: 18px;
        }

        .status-msg.show { opacity: 1; }
    </style>
</head>
<body>

    <header>
        <h1>Gerador de <span>Stories</span></h1>
        <p>Baixa PNG em 1080×1920 · pronto pro Insta</p>
    </header>

    <div class="nav" id="nav"></div>

    <div class="preview-wrap">
        <div class="preview-scaler" id="preview-scaler">
            <div id="preview-content"></div>
        </div>
    </div>

    <div class="botoes">
        <button class="btn btn-primario" id="btn-baixar" onclick="baixarStory()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>Baixar PNG</span>
        </button>
        <button class="btn btn-secundario" onclick="baixarTodos()" title="Baixa os 2 slides">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                <polyline points="2 17 12 22 22 17"/>
                <polyline points="2 12 12 17 22 12"/>
            </svg>
        </button>
    </div>

    <div class="status-msg" id="status-msg">✓ Baixado!</div>

    <div class="render-area" id="render-area"></div>

    <script>
        /* ═══════════ SVGs inline ═══════════ */
        const SVG = {
            brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.44-4.64Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.44-4.64Z"/></svg>',
            mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg>',
            lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
            arrowRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'
        };

        /* ═══════════ SLIDES ═══════════ */
        const SLIDES = [
            {
                nome: 'welcome',
                label: 'Welcome',
                html: `
                    <div class="story">
                        <div class="badge">✨ NOVIDADE</div>

                        <h1 class="story-title">
                            O Hub Brain<br>
                            <em>tá de cara nova</em>
                        </h1>
                        <p class="story-sub">Reformulamos a tela inicial pra ficar mais bonita, mais rápida e mais fácil de usar.</p>

                        <!-- Mockup celular -->
                        <div class="phone">
                            <div class="phone-screen">

                                    <div class="mock-w-header">
                                        <div class="mock-w-dot"></div>

                                        <div class="mock-w-kicker">ESTUDAR · ORGANIZAR · EVOLUIR</div>

                                        <p class="mock-w-desc">Agenda, notas, foco e IA num app só.<br>Feito por aluno, pra aluno.</p>
                                    </div>

                                    <div class="mock-w-btn mock-w-btn-primario">
                                        ${SVG.arrowRight}
                                        Começar agora
                                    </div>
                                    <div class="mock-w-btn mock-w-btn-secundario">
                                        Já tenho conta
                                    </div>

                                    <div class="mock-w-stats">
                                        <div class="mock-w-stat">
                                            <b>100%</b>
                                            <span>gratuito</span>
                                        </div>
                                        <div class="mock-w-stat">
                                            <b>0</b>
                                            <span>anúncios</span>
                                        </div>
                                        <div class="mock-w-stat">
                                            <b>24/7</b>
                                            <span>disponível</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 3 pontos-chave -->
                        <div class="features-row">
                            <div class="feat-mini">
                                <div class="feat-mini-icon">✨</div>
                                <div class="feat-mini-titulo">Nova tela</div>
                                <div class="feat-mini-desc">Design mais limpo</div>
                            </div>
                            <div class="feat-mini">
                                <div class="feat-mini-icon">🧮</div>
                                <div class="feat-mini-titulo">Calculadora</div>
                                <div class="feat-mini-desc">Sem criar conta</div>
                            </div>
                            <div class="feat-mini">
                                <div class="feat-mini-icon">📊</div>
                                <div class="feat-mini-titulo">Brasil em números</div>
                                <div class="feat-mini-desc">Dados do INEP</div>
                            </div>
                        </div>

                        <div class="story-footer">
                            <div class="story-logo">HUB BRAIN</div>
                            <div class="story-url">hubbrain.netlify.app</div>
                        </div>
                    </div>
                `
            },
            {
                nome: 'login',
                label: 'Login',
                html: `
                    <div class="story">
                        <div class="badge">🔐 NOVO LOGIN</div>

                        <h1 class="story-title">
                            Entrar ficou<br>
                            <em>mais fácil</em>
                        </h1>
                        <p class="story-sub">Login, cadastro e recuperação de senha repaginados. Design novo, mais rápido e mais seguro.</p>

                        <!-- Mockup celular -->
                        <div class="phone">
                            <div class="phone-screen">
                                <div class="mock-login">
                                    <div class="mock-l-logo">
                                        ${SVG.brain}
                                    </div>

                                    <div class="mock-l-header">
                                        <div class="mock-l-kicker">BEM-VINDO DE VOLTA</div>
                                        <h3 class="mock-l-title">Entrar no <em>Hub Brain</em></h3>
                                    </div>

                                    <div class="mock-l-form">
                                        <div class="mock-l-campo">
                                            <span class="mock-l-label">E-MAIL</span>
                                            <div class="mock-l-input">
                                                ${SVG.mail}
                                                seu@email.com
                                            </div>
                                        </div>

                                        <div class="mock-l-campo">
                                            <span class="mock-l-label">SENHA</span>
                                            <div class="mock-l-input focus">
                                                ${SVG.lock}
                                                ••••••••
                                            </div>
                                        </div>

                                        <div class="mock-l-btn">
                                            Entrar
                                        </div>

                                        <div class="mock-l-footer">
                                            Não tem conta? <b>Criar agora</b>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 3 pontos-chave -->
                        <div class="features-row">
                            <div class="feat-mini">
                                <div class="feat-mini-icon">⚡</div>
                                <div class="feat-mini-titulo">Mais rápido</div>
                                <div class="feat-mini-desc">Entra em segundos</div>
                            </div>
                            <div class="feat-mini">
                                <div class="feat-mini-icon">👁️</div>
                                <div class="feat-mini-titulo">Mais bonito</div>
                                <div class="feat-mini-desc">Design clean</div>
                            </div>
                            <div class="feat-mini">
                                <div class="feat-mini-icon">🔒</div>
                                <div class="feat-mini-titulo">Mais seguro</div>
                                <div class="feat-mini-desc">Valida termos</div>
                            </div>
                        </div>

                        <div class="story-footer">
                            <div class="story-logo">HUB BRAIN</div>
                            <div class="story-url">hubbrain.netlify.app</div>
                        </div>
                    </div>
                `
            }
        ];

        let slideAtual = 0;

        /* ═══════════ NAVEGAÇÃO ═══════════ */
        function montarNav() {
            const nav = document.getElementById('nav');
            nav.innerHTML = '';
            SLIDES.forEach((s, i) => {
                const b = document.createElement('button');
                b.className = 'nav-btn' + (i === 0 ? ' on' : '');
                b.textContent = s.label;
                b.onclick = () => mudarSlide(i);
                nav.appendChild(b);
            });
        }

        function mudarSlide(idx) {
            slideAtual = idx;
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.classList.toggle('on', i === idx);
            });
            renderizar(idx);
        }

        function renderizar(idx, target) {
            const alvo = target || document.getElementById('preview-content');
            alvo.innerHTML = SLIDES[idx].html;
        }

        /* ═══════════ DOWNLOAD ═══════════ */
        async function baixarStory() {
            const btn = document.getElementById('btn-baixar');
            const status = document.getElementById('status-msg');

            btn.disabled = true;
            btn.querySelector('span').textContent = 'Gerando...';

            try {
                const renderArea = document.getElementById('render-area');
                renderizar(slideAtual, renderArea);

                await new Promise(r => setTimeout(r, 300));

                const canvas = await html2canvas(renderArea.firstElementChild, {
                    width: 1080,
                    height: 1920,
                    scale: 1,
                    backgroundColor: null,
                    useCORS: true,
                    logging: false
                });

                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `hub-brain-story-${SLIDES[slideAtual].nome}.png`;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 2000);

                    renderArea.innerHTML = '';

                    status.classList.add('show');
                    setTimeout(() => status.classList.remove('show'), 2200);

                    btn.disabled = false;
                    btn.querySelector('span').textContent = 'Baixar PNG';
                }, 'image/png');

            } catch (e) {
                console.error('[story]', e);
                alert('Erro ao gerar imagem: ' + e.message);
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Baixar PNG';
            }
        }

        async function baixarTodos() {
            const btn = document.querySelector('.btn-secundario');
            btn.disabled = true;

            for (let i = 0; i < SLIDES.length; i++) {
                slideAtual = i;
                await baixarStory();
                await new Promise(r => setTimeout(r, 600));
            }

            btn.disabled = false;
        }

        /* ═══════════ INIT ═══════════ */
        montarNav();
        renderizar(0);
    </script>
</body>
</html>
