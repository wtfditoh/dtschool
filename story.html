<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Stories - Login Hub Brain</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="story.css">
</head>
<body>

    <header class="header">
        <h1>Gerador de <span>Stories</span></h1>
        <p>Baixa PNG em 1080×1920 · pronto pro Insta</p>
    </header>

    <div class="upload-area">
        <label class="upload-btn" id="upload-label">
            <input type="file" id="upload-input" accept="image/*" hidden>
            <span id="upload-text">📱 Subir print</span>
        </label>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="preview-wrap">
        <div class="preview-scaler" id="preview-scaler">
            <div id="preview-content"></div>
        </div>
    </div>

    <div class="botoes">
        <button class="btn btn-primario" id="btn-baixar" onclick="baixarStory()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>Baixar PNG</span>
        </button>
        <button class="btn btn-secundario" onclick="baixarTodos()" title="Baixa todos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                <polyline points="2 17 12 22 22 17"/>
                <polyline points="2 12 12 17 22 12"/>
            </svg>
        </button>
    </div>

    <div class="status-msg" id="status-msg">✓ Baixado!</div>

    <div class="render-area" id="render-area"></div>

    <script src="story.js"></script>
</body>
</html>
