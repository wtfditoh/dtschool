<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub Brain - Cadastro</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-wrapper">
    
    <!-- MASCOTE 3D BRAIN -->
    <div class="brain-mascot" id="mascote">
        <div class="brain-orb">
            <div class="orb-inner">
                <div class="orb-glow"></div>
                <div class="orb-core">
                    <i data-lucide="brain-circuit" class="brain-icon"></i>
                </div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-ring ring-3"></div>
            </div>
            
            <!-- OLHOS -->
            <div class="eyes-container">
                <div class="eye left-eye">
                    <div class="pupil" id="pupil-left"></div>
                    <div class="shine"></div>
                </div>
                <div class="eye right-eye">
                    <div class="pupil" id="pupil-right"></div>
                    <div class="shine"></div>
                </div>
            </div>
        </div>
        
        <!-- PARTÍCULAS FLUTUANTES -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- CARD CADASTRO -->
    <div class="login-card" id="login-card">
        <div class="card-glow"></div>
        
        <div class="logo-section">
            <h1>CRIAR <span>CONTA</span></h1>
            <p>Entre para o ranking de estudantes</p>
        </div>

        <div class="input-field">
            <div class="input-icon">
                <i data-lucide="user"></i>
            </div>
            <input 
                type="text" 
                id="user-name" 
                placeholder="Seu nome" 
                autocomplete="name"
                spellcheck="false"
            >
        </div>

        <div class="input-field">
            <div class="input-icon">
                <i data-lucide="mail"></i>
            </div>
            <input 
                type="email" 
                id="user-email" 
                placeholder="Seu melhor e-mail" 
                autocomplete="email"
                spellcheck="false"
            >
        </div>

        <div class="input-field">
            <div class="input-icon">
                <i data-lucide="lock"></i>
            </div>
            <input 
                type="password" 
                id="user-pass" 
                placeholder="Crie uma senha forte" 
                autocomplete="new-password"
                oninput="checarForca()"
            >
            <button type="button" class="toggle-password" onclick="toggleSenha()">
                <i data-lucide="eye" id="eye-icon"></i>
            </button>
        </div>

        <!-- FORÇA DA SENHA -->
        <div class="password-strength" id="strength-box">
            <div class="strength-bars">
                <div class="bar" id="bar1"></div>
                <div class="bar" id="bar2"></div>
                <div class="bar" id="bar3"></div>
                <div class="bar" id="bar4"></div>
            </div>
            <span class="strength-label" id="strength-label">SENHA MUITO FRACA</span>
        </div>

        <div id="login-status" class="status-message"></div>

        <button class="btn-primary" onclick="realizarCadastro(event)">
            <span>Criar Conta</span>
            <i data-lucide="user-plus"></i>
        </button>

        <div class="footer-actions">
            <a href="login.html" class="link-secondary">Já tem conta? <strong>Entrar agora</strong></a>
        </div>

        <div class="policy-links">
            <a href="privacidade.html">Privacidade</a>
            <span>·</span>
            <a href="termos.html">Termos</a>
        </div>
    </div>
</div>

<script type="module" src="login-logica.js"></script>
<script>
    lucide.createIcons();

    const mascote = document.getElementById('mascote');
    const inputName = document.getElementById('user-name');
    const inputEmail = document.getElementById('user-email');
    const inputPass = document.getElementById('user-pass');
    const card = document.getElementById('login-card');
    const pupilL = document.getElementById('pupil-left');
    const pupilR = document.getElementById('pupil-right');

    // ── MOVIMENTO DOS OLHOS ─────────────────────────────────────────
    function moverOlhos(x, y) {
        if (!mascote || mascote.classList.contains('hide-eyes')) return;
        const rect = mascote.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        const deltaX = x - centerX;
        const deltaY = y - centerY;
        const angle = Math.atan2(deltaY, deltaX);
        const distance = Math.min(3, Math.sqrt(deltaX * deltaX + deltaY * deltaY) / 30);
        
        const moveX = Math.cos(angle) * distance;
        const moveY = Math.sin(angle) * distance;
        
        if (pupilL) pupilL.style.transform = `translate(${moveX}px, ${moveY}px)`;
        if (pupilR) pupilR.style.transform = `translate(${moveX}px, ${moveY}px)`;
    }

    document.addEventListener('mousemove', e => moverOlhos(e.clientX, e.clientY));
    document.addEventListener('touchmove', e => {
        if (e.touches[0]) moverOlhos(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // ── ESTADOS DO MASCOTE ─────────────────────────────────────────
    [inputName, inputEmail].forEach(input => {
        if (!input) return;
        input.addEventListener('focus', () => {
            mascote.classList.remove('hide-eyes', 'error', 'success');
            if (pupilL) pupilL.style.transform = 'translate(0, 4px)';
            if (pupilR) pupilR.style.transform = 'translate(0, 4px)';
        });
        input.addEventListener('blur', () => {
            if (pupilL) pupilL.style.transform = 'translate(0, 0)';
            if (pupilR) pupilR.style.transform = 'translate(0, 0)';
        });
    });

    inputPass && inputPass.addEventListener('focus', () => {
        mascote.classList.add('hide-eyes');
        mascote.classList.remove('error', 'success');
    });

    inputPass && inputPass.addEventListener('blur', () => {
        mascote.classList.remove('hide-eyes');
    });

    // ── TOGGLE SENHA ────────────────────────────────────────────────
    window.toggleSenha = function() {
        const type = inputPass.type === 'password' ? 'text' : 'password';
        inputPass.type = type;
        const icon = document.getElementById('eye-icon');
        icon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
        lucide.createIcons();
    };

    // ── FORÇA DA SENHA ──────────────────────────────────────────────
    window.checarForca = function() {
        const val = inputPass.value;
        const box = document.getElementById('strength-box');
        
        if (!val) {
            box.style.display = 'none';
            return;
        }
        
        box.style.display = 'block';
        
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        
        const colors = ['#ff4455', '#ff8800', '#ffbb33', '#00e5a0'];
        const labels = ['SENHA FRACA', 'SENHA MÉDIA', 'SENHA BOA', 'SENHA FORTE'];
        
        for (let i = 1; i <= 4; i++) {
            const bar = document.getElementById('bar' + i);
            if (bar) bar.style.background = i <= score ? colors[score - 1] : 'rgba(255,255,255,0.05)';
        }
        
        const label = document.getElementById('strength-label');
        if (label) {
            label.textContent = labels[score - 1] || 'SENHA MUITO FRACA';
            label.style.color = colors[score - 1] || '#ff4455';
        }
    };

    // ── ANIMAÇÕES DE FEEDBACK ───────────────────────────────────────
    window.yetiErro = function() {
        mascote.classList.add('error');
        mascote.classList.remove('success', 'hide-eyes');
        card.classList.add('shake-error');
        setTimeout(() => {
            mascote.classList.remove('error');
            card.classList.remove('shake-error');
        }, 1500);
    };

    window.yetiSucesso = function() {
        mascote.classList.add('success');
        mascote.classList.remove('error', 'hide-eyes');
    };
</script>
</body>
</html>
