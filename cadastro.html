<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="hb-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Criar Conta - Hub Brain</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- FUNDO ANIMADO -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-tv-text">HUB <em>BRAIN</em></div>

    <a href="login.html" class="btn-voltar">
        <i data-lucide="arrow-left"></i>
    </a>

    <main class="login-wrapper">
        <div class="header-txt">
            <span class="kicker">NOVO POR AQUI?</span>
            <h1>Criar sua <em>conta grátis</em></h1>
        </div>

        <div class="glass-card">
            <form class="form" onsubmit="realizarCadastro(event)">
                <div class="campo">
                    <label>NOME</label>
                    <div class="input-wrap">
                        <i data-lucide="user"></i>
                        <input type="text" id="user-name" placeholder="Como quer ser chamado" autocomplete="name" spellcheck="false">
                    </div>
                </div>

                <div class="campo">
                    <label>E-MAIL</label>
                    <div class="input-wrap">
                        <i data-lucide="mail"></i>
                        <input type="email" id="user-email" placeholder="seu@email.com" autocomplete="email" spellcheck="false">
                    </div>
                </div>

                <div class="campo">
                    <label>SENHA</label>
                    <div class="input-wrap">
                        <i data-lucide="lock"></i>
                        <input type="password" id="user-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="checarForca()">
                        <button type="button" class="ver-senha" onclick="toggleSenha()">
                            <i data-lucide="eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label>CONFIRMAR SENHA</label>
                    <div class="input-wrap">
                        <i data-lucide="lock"></i>
                        <input type="password" id="user-pass-2" placeholder="Repete a senha" autocomplete="new-password">
                    </div>
                </div>

                <div class="linha-extra" style="margin-top: 10px;">
                    <label class="check">
                        <input type="checkbox" id="aceito-termos">
                        <span></span>
                        <small>Aceito os <a href="termos.html" target="_blank" style="color:var(--roxo-claro);text-decoration:none">termos</a></small>
                    </label>
                </div>

                <div id="login-status" class="status"></div>

                <button type="submit" class="btn-roxo">
                    <span>Criar conta</span>
                    <i data-lucide="user-plus"></i>
                </button>
            </form>
        </div>

        <div class="rodape-form">
            <span>Já tem conta?</span>
            <a href="login.html">Entrar agora</a>
        </div>
    </main>

    <script type="module" src="login-logica.js"></script>
    <script>
        lucide.createIcons();
        const inputPass = document.getElementById('user-pass');
        window.toggleSenha = function () {
            const t = inputPass.type === 'password' ? 'text' : 'password';
            inputPass.type = t;
            document.getElementById('eye-icon').setAttribute('data-lucide', t === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        };
    </script>
</body>
</html>
