<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub Brain - Criar Conta</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <!-- LOADER -->
    <div id="hb-loading">
        <img src="https://media1.tenor.com/m/tN4-q43SkzcAAAAC/scuba.gif" alt="">
        <p>Preparando sua conta...</p>
    </div>

    <a href="login.html" class="voltar">
        <i data-lucide="arrow-left"></i>
    </a>

    <main class="container">

        <div class="topo">
            <img src="icon-514_20260512_161420_0000.png" alt="Hub Brain">
        </div>

        <div class="header-txt">
            <span class="kicker">NOVO POR AQUI?</span>
            <h1>Criar sua<br><em>conta grátis</em></h1>
        </div>

        <form class="form" onsubmit="realizarCadastro(event)">
            <div class="campo">
                <label>NOME</label>
                <div class="input-wrap">
                    <i data-lucide="user"></i>
                    <input type="text" id="user-name" placeholder="Como quer ser chamado" autocomplete="name" spellcheck="false">
                </div>
            </div>

            <div class="campo">
                <label>E-MAIL</label>
                <div class="input-wrap">
                    <i data-lucide="mail"></i>
                    <input type="email" id="user-email" placeholder="seu@email.com" autocomplete="email" spellcheck="false">
                </div>
            </div>

            <div class="campo">
                <label>SENHA</label>
                <div class="input-wrap">
                    <i data-lucide="lock"></i>
                    <input type="password" id="user-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="checarForca()">
                    <button type="button" class="ver-senha" onclick="toggleSenha()">
                        <i data-lucide="eye" id="eye-icon"></i>
                    </button>
                </div>
                <div class="forca" id="forca-box" style="display:none">
                    <div class="forca-barras">
                        <div class="forca-bar" id="bar1"></div>
                        <div class="forca-bar" id="bar2"></div>
                        <div class="forca-bar" id="bar3"></div>
                        <div class="forca-bar" id="bar4"></div>
                    </div>
                    <span class="forca-label" id="forca-label">SENHA FRACA</span>
                </div>
            </div>

            <div class="linha-extra">
                <label class="check">
                    <input type="checkbox" id="aceito-termos">
                    <span></span>
                    <small>Aceito os <a href="termos.html" style="color:var(--roxo-claro);text-decoration:none">termos</a></small>
                </label>
            </div>

            <div id="login-status" class="status"></div>

            <button type="submit" class="btn-roxo">
                <i data-lucide="user-plus"></i>
                <span>Criar conta</span>
            </button>
        </form>

        <div class="rodape-form">
            <span>Já tem conta?</span>
            <a href="login.html">Entrar agora</a>
        </div>

        <div class="policy">
            <a href="privacidade.html">Privacidade</a>
            <span>·</span>
            <a href="termos.html">Termos</a>
        </div>

    </main>

    <script type="module" src="login-logica.js"></script>
    <script src="auth-loader.js"></script>
    <script>
        lucide.createIcons();
        const inputPass = document.getElementById('user-pass');
        window.toggleSenha = function () {
            const t = inputPass.type === 'password' ? 'text' : 'password';
            inputPass.type = t;
            document.getElementById('eye-icon').setAttribute('data-lucide', t === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        };
        window.checarForca = function () {
            const val = inputPass.value;
            const box = document.getElementById('forca-box');
            if (!val) { box.style.display = 'none'; return; }
            box.style.display = 'block';
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const colors = ['#ff4455', '#ff8800', '#ffbb33', '#00e5a0'];
            const labels = ['SENHA FRACA', 'SENHA MÉDIA', 'SENHA BOA', 'SENHA FORTE'];
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById('bar' + i);
                if (bar) bar.style.background = i <= score ? colors[score - 1] : 'rgba(255,255,255,0.06)';
            }
            const label = document.getElementById('forca-label');
            if (label) {
                label.textContent = labels[score - 1] || 'SENHA FRACA';
                label.style.color = colors[score - 1] || '#ff4455';
            }
        };
    </script>
</body>
</html>
