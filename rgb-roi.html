<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub Brain | Análise RGB • HSV • Grayscale</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="theme-toggle.css">
    <script src="theme-manager.js"></script>
    
    <style>
        :root {
            --p: #8a2be2; --p2: #c084fc; --pd: rgba(138,43,226,0.1);
            --bg: #060608; --card: #0c0c10; --border: rgba(138,43,226,0.15);
            --t: #e8e0f0; --td: #444; --mono: 'DM Mono', monospace;
            --green: #00e5a0; --green-d: rgba(0,229,160,0.1);
        }
        * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--t); font-family:'Space Grotesk',sans-serif; min-height:100vh; overflow-x:hidden; }
        body::before { content:''; position:fixed; top:-200px; left:50%; transform:translateX(-50%); width:600px; height:400px; background:radial-gradient(ellipse, rgba(138,43,226,0.07) 0%, transparent 70%); pointer-events:none; z-index:0; }

        /* HEADER */
        .glass-header { display:flex; align-items:center; justify-content:space-between; padding:0 16px; height:60px; background:rgba(6,6,8,0.96); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1000; }
        
        .header-logo-animated {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0;
            cursor: pointer;
        }

        .logo-hub {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: white;
        }

        .logo-brain-icon {
            width: 36px;
            height: 36px;
            margin: 0 8px;
        }

        .logo-brain-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-brain {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #8a2be2 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-menu { background:rgba(255,255,255,0.03); border:1px solid #1a1a1a; color:white; padding:9px; border-radius:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

        /* BOTÕES DE MODO */
        .mode-selector { display:flex; gap:6px; background:rgba(0,0,0,0.3); padding:4px; border-radius:12px; border:1px solid rgba(255,255,255,0.05); margin-bottom:16px; }
        .mode-btn { flex:1; padding:10px 8px; border-radius:10px; font-size:10px; font-weight:800; letter-spacing:1px; cursor:pointer; border:none; font-family:inherit; transition:0.2s; background:transparent; color:#555; }
        .mode-btn.active { background:linear-gradient(135deg,var(--p),#6a1cb2); color:white; box-shadow:0 2px 12px rgba(138,43,226,0.4); }

        /* CONTAINER */
        .container { max-width:500px; margin:0 auto; padding:20px 16px 100px; position:relative; z-index:1; }

        /* UPLOAD */
        .upload-area { background:var(--card); border:2px dashed rgba(138,43,226,0.2); border-radius:20px; padding:32px 20px; text-align:center; cursor:pointer; transition:0.2s; margin-bottom:16px; }
        .upload-area:hover { border-color:var(--p); background:rgba(138,43,226,0.04); }
        .upload-area.has-image { border-style:solid; border-color:var(--border); padding:0; }
        .upload-icon { font-size:36px; margin-bottom:10px; }
        .upload-title { font-size:14px; font-weight:700; color:white; margin-bottom:4px; }
        .upload-sub { font-size:11px; color:var(--td); }
        .upload-btns { display:flex; gap:10px; justify-content:center; margin-top:16px; }
        .upload-btn { display:flex; align-items:center; gap:6px; padding:10px 18px; border-radius:12px; font-size:12px; font-weight:700; cursor:pointer; border:none; font-family:inherit; transition:0.2s; }
        .upload-btn.galeria { background:var(--pd); border:1px solid var(--border); color:var(--p2); }
        .upload-btn.camera { background:linear-gradient(135deg,var(--p),#6a1cb2); color:white; box-shadow:0 4px 16px rgba(138,43,226,0.3); }
        .upload-btn i { width:14px; height:14px; }

        /* CANVAS */
        .canvas-wrap { position:relative; width:100%; border-radius:18px; overflow:hidden; background:#000; touch-action:none; }
        #canvas-main { display:block; width:100%; height:auto; cursor:crosshair; user-select:none; }

        /* AÇÕES */
        .actions-row { display:flex; gap:8px; margin-top:10px; margin-bottom:20px; }
        .btn-action { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:13px; border-radius:14px; font-size:12px; font-weight:800; cursor:pointer; border:none; font-family:inherit; letter-spacing:0.5px; transition:0.2s; }
        .btn-analisar { background:linear-gradient(135deg,var(--p),#6a1cb2); color:white; box-shadow:0 4px 16px rgba(138,43,226,0.3); }
        .btn-analisar:disabled { opacity:0.4; cursor:not-allowed; }
        .btn-limpar { background:rgba(255,255,255,0.04); border:1px solid #1a1a1a; color:var(--td); }

        /* RESULTADO */
        .resultado-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:16px; display:none; }
        .resultado-card.visible { display:block; animation:fadeIn 0.4s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
        .resultado-titulo { font-size:10px; font-weight:800; letter-spacing:3px; color:var(--td); margin-bottom:16px; }

        /* COR PREVIEW */
        .cor-preview { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
        .cor-swatch { width:70px; height:70px; border-radius:16px; flex-shrink:0; box-shadow:0 4px 20px rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.1); }
        .cor-hex { font-family:var(--mono); font-size:22px; font-weight:700; color:white; }
        .cor-nome { font-size:11px; color:var(--td); margin-top:4px; }

        /* RGB BARS */
        .rgb-bars { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
        .rgb-bar-row { display:flex; align-items:center; gap:10px; }
        .rgb-bar-label { font-family:var(--mono); font-size:11px; font-weight:700; min-width:20px; }
        .rgb-bar-track { flex:1; height:8px; border-radius:10px; background:rgba(255,255,255,0.05); overflow:hidden; }
        .rgb-bar-fill { height:100%; border-radius:10px; transition:width 0.6s ease; }
        .rgb-bar-val { font-family:var(--mono); font-size:11px; color:var(--td); min-width:50px; text-align:right; }

        /* SEÇÕES RGB/HSV/GRAY */
        .color-section { display:none; }
        .color-section.active { display:block; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="glass-header">
        <button id="open-menu" class="btn-menu">
            <i data-lucide="menu"></i>
        </button>
        
        <div class="header-logo-animated" onclick="window.location.href='index.html'">
            <span class="logo-hub">HUB</span>
            <div class="logo-brain-icon">
                <img src="icon-514_20260512_161420_0000.png" alt="Brain">
            </div>
            <span class="logo-brain">BRAIN</span>
        </div>

        <div style="width:44px;"></div>
    </header>

    <!-- CONTAINER -->
    <div class="container">
        
        <!-- SELETOR DE MODO -->
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="rgb" onclick="trocarModo('rgb')">RGB</button>
            <button class="mode-btn" data-mode="hsv" onclick="trocarModo('hsv')">HSV</button>
            <button class="mode-btn" data-mode="gray" onclick="trocarModo('gray')">GRAYSCALE</button>
        </div>

        <!-- UPLOAD -->
        <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
            <div class="upload-icon">📸</div>
            <div class="upload-title">Escolha uma imagem</div>
            <div class="upload-sub">Clique ou arraste uma foto</div>
            <div class="upload-btns">
                <button class="upload-btn galeria" onclick="event.stopPropagation(); document.getElementById('file-input').click()">
                    <i data-lucide="image"></i>
                    Galeria
                </button>
                <button class="upload-btn camera" onclick="event.stopPropagation(); document.getElementById('camera-input').click()">
                    <i data-lucide="camera"></i>
                    Câmera
                </button>
            </div>
        </div>

        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">

        <!-- CANVAS -->
        <div class="canvas-wrap" id="canvas-wrap" style="display:none;">
            <canvas id="canvas-main"></canvas>
        </div>

        <!-- AÇÕES -->
        <div class="actions-row" style="display:none;" id="actions-row">
            <button class="btn-action btn-analisar" id="btn-analisar" onclick="analisar()">
                <i data-lucide="zap"></i>
                ANALISAR
            </button>
            <button class="btn-action btn-limpar" onclick="limpar()">
                <i data-lucide="x"></i>
                LIMPAR
            </button>
        </div>

        <!-- RESULTADOS RGB -->
        <div id="resultado-rgb" class="resultado-card color-section active">
            <div class="resultado-titulo">ANÁLISE RGB</div>
            
            <div class="cor-preview">
                <div class="cor-swatch" id="cor-swatch-rgb"></div>
                <div>
                    <div class="cor-hex" id="cor-hex-rgb">#000000</div>
                    <div class="cor-nome" id="cor-nome-rgb">--</div>
                </div>
            </div>

            <div class="rgb-bars">
                <div class="rgb-bar-row">
                    <div class="rgb-bar-label" style="color:#ff5555;">R</div>
                    <div class="rgb-bar-track">
                        <div class="rgb-bar-fill" id="bar-r" style="background:#ff5555;"></div>
                    </div>
                    <div class="rgb-bar-val" id="val-r">0</div>
                </div>
                <div class="rgb-bar-row">
                    <div class="rgb-bar-label" style="color:#55ff55;">G</div>
                    <div class="rgb-bar-track">
                        <div class="rgb-bar-fill" id="bar-g" style="background:#55ff55;"></div>
                    </div>
                    <div class="rgb-bar-val" id="val-g">0</div>
                </div>
                <div class="rgb-bar-row">
                    <div class="rgb-bar-label" style="color:#5599ff;">B</div>
                    <div class="rgb-bar-track">
                        <div class="rgb-bar-fill" id="bar-b" style="background:#5599ff;"></div>
                    </div>
                    <div class="rgb-bar-val" id="val-b">0</div>
                </div>
            </div>
        </div>

        <!-- RESULTADOS HSV -->
        <div id="resultado-hsv" class="resultado-card color-section">
            <div class="resultado-titulo">ANÁLISE HSV</div>
            
            <div class="cor-preview">
                <div class="cor-swatch" id="cor-swatch-hsv"></div>
                <div>
                    <div class="cor-hex" id="cor-hex-hsv">#000000</div>
                    <div class="cor-nome">HSV Color Space</div>
                </div>
            </div>

            <div class="rgb-bars">
                <div class="rgb-bar-row">
                    <div class="rgb-bar-label" style="color:var(--p2);">H</div>
                    <div class="rgb-bar-track">
                        <div class="rgb-bar-fill" id="bar-h" style="background:linear-gradient(90deg,red,yellow,lime,cyan,blue,magenta,red);"></div>
                    </div>
                    <div class="rgb-bar-val" id="val-h">0°</div>
                </div>
                <div class="rgb-bar-row">
                    <div class="rgb-bar-label" style="color:#00e5a0;">S</div>
                    <div class="rgb-bar-track">
                        <div class="rgb-bar-fill" id="bar-s" style="background:#00e5a0;"></div>
                    </div>
                    <div class="rgb-bar-val" id="val-s">0%</div>
                </div>
                <div class="rgb-bar-row">
                    <div class="rgb-bar-label" style="color:#ffffff;">V</div>
                    <div class="rgb-bar-track">
                        <div class="rgb-bar-fill" id="bar-v" style="background:#ffffff;"></div>
                    </div>
                    <div class="rgb-bar-val" id="val-v">0%</div>
                </div>
            </div>
        </div>

        <!-- RESULTADOS GRAYSCALE -->
        <div id="resultado-gray" class="resultado-card color-section">
            <div class="resultado-titulo">ANÁLISE GRAYSCALE</div>
            
            <div class="cor-preview">
                <div class="cor-swatch" id="cor-swatch-gray"></div>
                <div>
                    <div class="cor-hex" id="cor-hex-gray">#000000</div>
                    <div class="cor-nome">Escala de Cinza</div>
                </div>
            </div>

            <div class="rgb-bars">
                <div class="rgb-bar-row">
                    <div class="rgb-bar-label" style="color:#aaa;">GRAY</div>
                    <div class="rgb-bar-track">
                        <div class="rgb-bar-fill" id="bar-gray" style="background:linear-gradient(90deg,#000,#fff);"></div>
                    </div>
                    <div class="rgb-bar-val" id="val-gray">0</div>
                </div>
            </div>

            <div style="margin-top:20px;padding:14px;background:rgba(0,0,0,0.3);border-radius:12px;font-size:11px;color:#666;line-height:1.6;">
                <strong style="color:#aaa;">Fórmula:</strong> Gray = (0.299×R) + (0.587×G) + (0.114×B)
            </div>
        </div>

    </div>

    <script src="menu.js"></script>
    <script>
        let imagemCarregada = null;
        let modoAtual = 'rgb';
        let corAnalisada = null;

        // ═══════════════════════════════════════════════════════════
        // TROCAR MODO (RGB / HSV / GRAYSCALE)
        // ═══════════════════════════════════════════════════════════
        
        function trocarModo(modo) {
            modoAtual = modo;
            
            // Atualiza botões
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-mode="${modo}"]`).classList.add('active');
            
            // Mostra seção correta
            document.querySelectorAll('.color-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(`resultado-${modo}`).classList.add('active');
            
            // Re-analisa se já tem cor
            if (corAnalisada) {
                mostrarResultados(corAnalisada);
            }
        }

        // ═══════════════════════════════════════════════════════════
        // UPLOAD DE IMAGEM
        // ═══════════════════════════════════════════════════════════
        
        document.getElementById('file-input').addEventListener('change', carregarImagem);
        document.getElementById('camera-input').addEventListener('change', carregarImagem);

        function carregarImagem(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    imagemCarregada = img;
                    desenharCanvas(img);
                    document.getElementById('upload-area').style.display = 'none';
                    document.getElementById('canvas-wrap').style.display = 'block';
                    document.getElementById('actions-row').style.display = 'flex';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function desenharCanvas(img) {
            const canvas = document.getElementById('canvas-main');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
        }

        // ═══════════════════════════════════════════════════════════
        // ANÁLISE DE COR (CLICK NO CANVAS)
        // ═══════════════════════════════════════════════════════════
        
        document.getElementById('canvas-main').addEventListener('click', function(e) {
            if (!imagemCarregada) return;
            
            const canvas = this;
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            const r = pixel[0];
            const g = pixel[1];
            const b = pixel[2];
            
            corAnalisada = {r, g, b};
            mostrarResultados(corAnalisada);
        });

        function analisar() {
            // Trigger análise automática no centro da imagem
            const canvas = document.getElementById('canvas-main');
            const ctx = canvas.getContext('2d');
            const pixel = ctx.getImageData(canvas.width/2, canvas.height/2, 1, 1).data;
            
            corAnalisada = {r: pixel[0], g: pixel[1], b: pixel[2]};
            mostrarResultados(corAnalisada);
        }

        // ═══════════════════════════════════════════════════════════
        // CONVERSÕES DE COR
        // ═══════════════════════════════════════════════════════════
        
        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join('');
        }

        function rgbToHsv(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;
            
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            const diff = max - min;
            
            let h = 0;
            if (diff !== 0) {
                if (max === r) h = ((g - b) / diff) % 6;
                else if (max === g) h = (b - r) / diff + 2;
                else h = (r - g) / diff + 4;
            }
            h = Math.round(h * 60);
            if (h < 0) h += 360;
            
            const s = max === 0 ? 0 : (diff / max);
            const v = max;
            
            return {
                h: h,
                s: Math.round(s * 100),
                v: Math.round(v * 100)
            };
        }

        function rgbToGray(r, g, b) {
            return Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        }

        // ═══════════════════════════════════════════════════════════
        // MOSTRAR RESULTADOS
        // ═══════════════════════════════════════════════════════════
        
        function mostrarResultados(cor) {
            const {r, g, b} = cor;
            const hex = rgbToHex(r, g, b);
            const hsv = rgbToHsv(r, g, b);
            const gray = rgbToGray(r, g, b);
            
            // ─── RGB ───
            document.getElementById('cor-swatch-rgb').style.background = hex;
            document.getElementById('cor-hex-rgb').textContent = hex.toUpperCase();
            
            document.getElementById('bar-r').style.width = (r / 255 * 100) + '%';
            document.getElementById('bar-g').style.width = (g / 255 * 100) + '%';
            document.getElementById('bar-b').style.width = (b / 255 * 100) + '%';
            
            document.getElementById('val-r').textContent = r;
            document.getElementById('val-g').textContent = g;
            document.getElementById('val-b').textContent = b;
            
            // ─── HSV ───
            document.getElementById('cor-swatch-hsv').style.background = hex;
            document.getElementById('cor-hex-hsv').textContent = hex.toUpperCase();
            
            document.getElementById('bar-h').style.width = (hsv.h / 360 * 100) + '%';
            document.getElementById('bar-s').style.width = hsv.s + '%';
            document.getElementById('bar-v').style.width = hsv.v + '%';
            
            document.getElementById('val-h').textContent = hsv.h + '°';
            document.getElementById('val-s').textContent = hsv.s + '%';
            document.getElementById('val-v').textContent = hsv.v + '%';
            
            // ─── GRAYSCALE ───
            const grayHex = rgbToHex(gray, gray, gray);
            document.getElementById('cor-swatch-gray').style.background = grayHex;
            document.getElementById('cor-hex-gray').textContent = grayHex.toUpperCase();
            
            document.getElementById('bar-gray').style.width = (gray / 255 * 100) + '%';
            document.getElementById('val-gray').textContent = gray;
            
            // Mostra resultado
            document.querySelectorAll('.resultado-card').forEach(card => {
                card.classList.add('visible');
            });
        }

        // ═══════════════════════════════════════════════════════════
        // LIMPAR
        // ═══════════════════════════════════════════════════════════
        
        function limpar() {
            imagemCarregada = null;
            corAnalisada = null;
            document.getElementById('upload-area').style.display = 'block';
            document.getElementById('canvas-wrap').style.display = 'none';
            document.getElementById('actions-row').style.display = 'none';
            document.querySelectorAll('.resultado-card').forEach(card => {
                card.classList.remove('visible');
            });
            document.getElementById('file-input').value = '';
            document.getElementById('camera-input').value = '';
        }

        // ═══════════════════════════════════════════════════════════
        // LUCIDE ICONS
        // ═══════════════════════════════════════════════════════════
        
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
